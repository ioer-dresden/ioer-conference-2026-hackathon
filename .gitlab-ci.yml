build:
  image: "registry.gitlab.vgiscience.org/tud_ifk/miniconda-cidefault:0.8.3"
  stage: build
  variables:
      GIT_FETCH_EXTRA_FLAGS: --tags
      GIT_STRATEGY: clone
  before_script:
       # initialize conda shell
      - conda init bash
      - source ~/.bashrc
      # activate default ci_env from registry image
      # contains anybadge
      - conda activate ci_env
      # - conda install "jupyter-book<2.0" -c conda-forge
  script:
      # checkout to release branch
      - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
      - git config --global user.name "semantic-release (via GitlabCI)"
      - git config --global user.email "semantic-release@gitlab"
      # create release version
      - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
      - git remote set-url origin "https://gitlab-ci-token:${GL_TOKEN}@${url_host}"
      - git fetch --unshallow || git fetch --all --tags
      - semantic-release version
      - semantic-release publish
      - git push origin main --follow-tags
      # create badges with version from latest tag
      - version_str=$(git describe --tags $(git rev-list --tags --max-count=1))
      - version_var=$(echo $version_str | cut -c2-)
      - echo "Version for badges $version_var"
      - anybadge -l version --value="${version_var}" --file=version.svg --color=#70A401
      - anybadge -l pipeline --value="passed" --file=pipeline.svg --color=#70A401
      - anybadge -l DOI --value="TBD" --file=doi.svg --color=#1081C1
      # convert readme to index.html and contributing.md and copy to webroot
      # use intermediate step to include mermaid conversion
      - mmdc -p ./.pandoc/puppeteer-config.json -i README.md -o README.md
      - mmdc -p ./.pandoc/puppeteer-config.json -i DEVELOPERS.md -o DEVELOPERS.md
      - pandoc --standalone --embed-resource -c readme.css --template .pandoc/readme.html -f gfm -t html README.md -o readme.html
      - pandoc --standalone --embed-resource -c readme.css --template .pandoc/readme.html -f gfm -t html DEVELOPERS.md -o developers.html
      # patch launch buttons to show Jupyter4NFDI instead of Binder
      - chmod +x scripts/patch_binder_links.sh
      - ./scripts/patch_binder_links.sh
      # create book
      - jupyter-book config sphinx .
      - jupyter-book build .
      # collect artifacts
      - mkdir ._site
      - cp *.svg ._site
      # copy book files
      - cp -r _build/html/* ._site/.
      - cp .pandoc/*.css ._site
      - cp .pandoc/*.png ._site
      - cp *.html ._site
      - cp -r resources/* ._site
      - cp references.bib ._site
      - cp -r editor ._site/
      # pre-compress the story map's text assets: geojson/js/css/html/json
      # gzip -k keeps the originals, so the site still works if the web
      # server has no gzip_static and serves the plain files instead
      - find ._site/storymap -type f \( -name '*.geojson' -o -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' \) -exec gzip -9 -k -f {} +
      - du -sh ._site/storymap
      - mv ._site _site
  artifacts:
    name: _site
    paths:
      - _site
  only:
    - main

deploy:
  stage: deploy
  image: "registry.gitlab.vgiscience.org/tud_ifk/rsync-ssh-alpine:alpine3.17-r0-v4"
  before_script:
  - eval $(ssh-agent -s)
  - echo "${SSH_PRIVKEY}" | ssh-add -
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
  - rsync -avu -zz --no-perms --omit-dir-times --chown=www-data:www-data --chmod=D775,F664 _site/ "${PRODUCTION_DESTINATION}"/public/ioerconference-hack/
  only:
    - main
